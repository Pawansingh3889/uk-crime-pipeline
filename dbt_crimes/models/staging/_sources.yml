version: 2

# Tell dbt where the raw crimes shelf is, and warn if it has not been refilled for 35 days.
sources:
  - name: raw
    description: Crime records landed by the ingestion scripts (PostgreSQL or Snowflake).
    tables:
      - name: crimes
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 70, period: day}
